replicaCount: 2

image:
  repository: ghcr.io/kishorhange111/production-rag-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  ragMode: "hybrid"
  ragTopK: "5"
  ragEmbedder: "BAAI/bge-small-en-v1.5"
  ragDataDir: "/app/data/sample"
  ragLlmUrl: ""
  ragLlmModel: "Qwen/Qwen2.5-7B-Instruct"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

metrics:
  scrape: true
  path: /metrics
