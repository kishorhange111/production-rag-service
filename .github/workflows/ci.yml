name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test the API
        run: |
          docker build -t ragservice .
          docker run -d -p 8080:8080 --name rag ragservice
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/query -H 'content-type: application/json' -d '{"question":"How long are backups kept?"}' | tee /dev/stderr | grep -q "35 days"
