[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragservice"
version = "0.1.0"
description = "Production-style RAG service: hybrid BM25 + dense retrieval, reranking, cited answers, prompt-injection screening, FastAPI streaming API and an evaluation suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["numpy>=1.24,<3", "fastapi>=0.110,<1", "pydantic>=2.5,<3", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0,<6", "torch>=2.1,<3", "transformers>=4.45,<6", "accelerate>=0.30,<2", "datasets>=2.18,<5"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]

[project.scripts]
ragservice-eval = "ragservice.eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
